name: CI

on:
  pull_request:
    branches: [main]

jobs:
  parser:
    name: Parser — lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/parser/package-lock.json

      - name: Install
        working-directory: packages/parser
        run: npm ci

      - name: Lint
        working-directory: packages/parser
        run: npm run lint

      - name: Typecheck
        working-directory: packages/parser
        run: npm run typecheck

      - name: Build
        working-directory: packages/parser
        run: npm run build

      - name: Test (with coverage)
        working-directory: packages/parser
        run: npm run test:coverage

      - name: Upload parser dist
        uses: actions/upload-artifact@v4
        with:
          name: parser-dist
          path: packages/parser/dist
          retention-days: 1

  react:
    name: React — lint / typecheck / test
    runs-on: ubuntu-latest
    needs: parser
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/react/package-lock.json

      - name: Download parser dist
        uses: actions/download-artifact@v4
        with:
          name: parser-dist
          path: packages/parser/dist

      - name: Install
        working-directory: packages/react
        run: npm ci

      - name: Lint
        working-directory: packages/react
        run: npm run lint

      - name: Typecheck
        working-directory: packages/react
        run: npm run typecheck

      - name: Build
        working-directory: packages/react
        run: npm run build

      - name: Test (with coverage)
        working-directory: packages/react
        run: npm run test:coverage

      - name: Upload react dist
        uses: actions/upload-artifact@v4
        with:
          name: react-dist
          path: packages/react/dist
          retention-days: 1

  playground:
    name: Playground — typecheck / build
    runs-on: ubuntu-latest
    needs: [parser, react]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/playground/package-lock.json

      - name: Download parser dist
        uses: actions/download-artifact@v4
        with:
          name: parser-dist
          path: packages/parser/dist

      - name: Download react dist
        uses: actions/download-artifact@v4
        with:
          name: react-dist
          path: packages/react/dist

      - name: Install
        working-directory: packages/playground
        run: npm ci

      - name: Build
        working-directory: packages/playground
        run: npm run build

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit parser
        working-directory: packages/parser
        run: npm install --ignore-scripts && npm audit --audit-level=high

      - name: Audit react
        working-directory: packages/react
        run: npm install --ignore-scripts && npm audit --audit-level=high

      - name: Audit playground
        working-directory: packages/playground
        run: npm install --ignore-scripts && npm audit --audit-level=high
